<!DOCTYPE html> <!--Indica que versión de HTML se usara-->
<html lang="en"> <!--Configura el idioma-->

<head> <!--Encabezado que contiene datos de la página (no se muestra)-->
    <meta charset="UTF-8"> <!--Permite usar caracteres especiales-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--Hace que la página se adapte a cualquier pantalla-->
    <title>Salto de linea en HTML</title> <!--Es el título que saldra en la pestaña de la página-->
</head> <!--Cierre del encabezado-->

<body> <!--Cuerpo de la página-->
    <h1>Lenguaje de programacion</h1> <!--Título más grande-->

    <!--Párrafo con información de la página-->
    <p>En la actualidad se utilizan diferentes 
        lenguajes de programacion tanto para desarrollo
        web, desarrollo movil, entranamiento de inteligencia
        artificial, pero de los mas usados son
        los siguientes:<br> <!--Saltos de linea-->
        Dart<br>
        Flutter<br>
        Python<br>
        Ruby<br>
        Java<br>
        TypeScript<br>
        Entre otros.
    </p> <!--Cierre del párrafo-->
</body> <!--Cierre del cuerpo-->

</html> <!--Cierre de todo el documento HTML-->
