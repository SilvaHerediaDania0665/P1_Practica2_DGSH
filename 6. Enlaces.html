<!DOCTYPE html> <!--Indica que versión de HTML se usara-->
<html lang="en"> <!--Configura el idioma-->

<head> <!--Encabezado que contiene datos de la página (no se muestra)-->
    <meta charset="UTF-8"> <!--Permite usar caracteres especiales-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--Hace que la página se adapte a cualquier pantalla-->
    <title>Enlaces en HTML</title> <!--Es el título que saldra en la pestaña de la página-->
</head> <!--Cierre del encabezado-->

<body> <!--Cuerpo de la página-->
    <h2>Tipos de enlaces en HTML</h2> <!--Título grande-->
    <p><strong>Enlaces/Hipervinculos a otra pagina del mismo sitio. </strong></p> <!--Párrafo con <strong> para hacer e texto en negritas-->

    <!--href"" para los enlaces de la página-->
    <a href="1. Hola_mundo.html">1. Hola Mundo</a><br> <!--<br> para salto en linea-->
    <a href="2. Encabezados.html" target="_self">2. Encabezados</a><br> <!--target="_self" abre el enlace en la misma ventana-->
    <a href="3. Parrafos.html" target="_blank">3. Parrafos</a><br> <!--target="_blank" abre el enlace en una nueva pestaña-->
    <a href="4. Salto de linea.html" target="_parent">4. Salto de linea</a><br> <!--target="_parent" abre el enlace en el contenedor padre-->
    <a href="5. Enfatizado.html" target="_top">5. Enfatizado</a><br> <!--target="_top" abre el enlace ocupando toda la pantalla-->

    <p><strong>Enlaces/Hipervinculos a sitios externos</strong></p> <!--Párrafo con <strong> para hacer e texto en negritas-->

     <!--href"" para los enlaces de la página-->
    <a href="https://www.google.com/">Google</a><br> <!--<br> para salto en linea-->
    <a href="https://www.youtube.com/" target="_self">YouTube</a><br>
    <a href="https://www.facebook.com/" target="_blank">FaceBook</a><br>
    <a href="https://www.wikipedia.com/" target="_parent">WikiPedia</a><br>
    <a href="https://www.espanol.yahoo.com/" target="_top">Yahoo!</a><br>
</body> <!--Cierre del cuerpo-->

</html> <!--Cierre de todo el documento HTML-->
